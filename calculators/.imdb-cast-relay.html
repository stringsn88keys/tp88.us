<!DOCTYPE html><html><head><meta charset="utf-8"><title>IMDB Cast Relay</title></head><body>
<script>
(function(){
  // Fragment (#cast=...) is never sent to the server, so no 414 from CloudFront
  var params = new URLSearchParams(window.location.hash.slice(1));
  var castJSON = params.get('cast'); // URLSearchParams already decodes
  if (!castJSON) { window.close(); return; }
  var cast;
  try { cast = JSON.parse(castJSON); } catch(e) { window.close(); return; }

  // Determine slot: slot 1 if empty or stale (>1h), else slot 2
  var s1 = null;
  try { s1 = JSON.parse(localStorage.getItem('imdb_cast_1') || 'null'); } catch(e) {}
  var slot = (!s1 || Date.now() - s1.ts > 3600000) ? 1 : 2;

  var payload = { title: cast.title, actors: cast.actors, ts: Date.now() };
  try {
    localStorage.setItem('imdb_cast_' + slot, JSON.stringify(payload));
    if (slot === 1) localStorage.removeItem('imdb_cast_2');
  } catch(e) {}

  // Broadcast to any open calculator tab (BroadcastChannel is same-origin, immune to COOP)
  try {
    var bc = new BroadcastChannel('imdb_cast_overlap');
    bc.postMessage({ type: 'imdb_cast', slot: slot, title: cast.title, actors: cast.actors });
    setTimeout(function(){ bc.close(); }, 300);
  } catch(e) {}

  // Only open the calculator for slot 1 — on slot 2 the calculator is already open
  // and will receive the data via BroadcastChannel above.
  // (COOP breaks named-window lookup across browsing context groups, so always opening
  //  would create a new window instead of reusing the existing one.)
  if (slot === 1) {
    var calcUrl = window.location.origin + '/calculators/imdb-cast-overlap.html';
    window.open(calcUrl, 'imdb_cast_overlap');
  }
  setTimeout(function(){ window.close(); }, 500);
})();
</script>
</body></html>
